<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Route Optimizer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#1e293b}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:#1e293b;color:#fff;padding:16px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.sidebar h1{font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #334155}
.nav-btn{display:block;width:100%;text-align:left;padding:10px 12px;border:none;background:transparent;color:#cbd5e1;border-radius:8px;cursor:pointer;font-size:14px;transition:.15s}
.nav-btn:hover{background:#334155;color:#fff}
.nav-btn.active{background:#2563eb;color:#fff}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.header{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header h2{font-size:18px;font-weight:600}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-dot.online{background:#22c55e}
.status-dot.offline{background:#ef4444}
.content{padding:24px;flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:16px;border:1px solid #e2e8f0}
.stat-card .label{font-size:12px;color:#64748b}
.stat-card .value{font-size:24px;font-weight:700;margin-top:4px}
.stat-card .value.blue{color:#2563eb}
.stat-card .value.green{color:#16a34a}
.stat-card .value.orange{color:#d97706}
.stat-card .value.red{color:#dc2626}
.card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:20px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;background:#f8fafc;border-bottom:2px solid #e2e8f0;font-weight:600;color:#475569}
td{padding:8px 10px;border-bottom:1px solid #f1f5f9}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge.critical{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.badge.high{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.badge.normal{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
.badge.low{background:#f9fafb;color:#6b7280;border:1px solid #e5e7eb}
.badge.status{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
#map{height:500px;border-radius:12px;border:1px solid #e2e8f0}
.driver-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.driver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.driver-status{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600}
.driver-status.en_route{background:#dbeafe;color:#1d4ed8}
.driver-status.delivering{background:#dcfce7;color:#166534}
.driver-status.available{background:#f0fdf4;color:#15803d}
.driver-status.offline{background:#f1f5f9;color:#64748b}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:5px 10px;font-size:12px}
.delivery-list{display:flex;flex-direction:column;gap:8px}
.delivery-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;cursor:grab}
.delivery-item:active{cursor:grabbing;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.delivery-item .seq{width:28px;height:28px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.delivery-item .info{flex:1;min-width:0}
.delivery-item .info .name{font-weight:600;font-size:13px}
.delivery-item .info .addr{font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.incident-card{display:flex;gap:12px;padding:12px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;margin-bottom:8px}
.incident-card .icon{font-size:20px}
.incident-card .details{font-size:13px}
.incident-card .details .type{font-weight:600;color:#dc2626}
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:1000;display:none;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.hidden{display:none!important}
.tab-content{display:none}.tab-content.active{display:block}
select{padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>Fleet Optimizer</h1>
    <button class="nav-btn active" data-tab="dashboard">Dashboard</button>
    <button class="nav-btn" data-tab="map">Mapa</button>
    <button class="nav-btn" data-tab="drivers">Motoristas</button>
    <button class="nav-btn" data-tab="deliveries">Entregas</button>
  </aside>
  <div class="main">
    <div class="header">
      <h2 id="page-title">Dashboard</h2>
      <span><span class="status-dot online" id="conn-dot"></span><span id="conn-text">Conectado</span></span>
    </div>
    <div class="content">
      <!-- DASHBOARD -->
      <div class="tab-content active" id="tab-dashboard">
        <div class="stats" id="stats-grid"></div>
        <div class="card"><h3>Entregas Ativas</h3><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Endereço</th><th>Prioridade</th><th>Status</th><th>Seq</th></tr></thead><tbody id="deliveries-table"></tbody></table></div>
        <div class="card"><h3>Incidentes Waze Ativos</h3><div id="incidents-list"></div></div>
      </div>
      <!-- MAP -->
      <div class="tab-content" id="tab-map">
        <div class="card"><h3>Mapa em Tempo Real</h3><div id="map"></div></div>
      </div>
      <!-- DRIVERS -->
      <div class="tab-content" id="tab-drivers">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h3>Motoristas</h3>
        </div>
        <div class="driver-grid" id="drivers-grid"></div>
      </div>
      <!-- DELIVERIES -->
      <div class="tab-content" id="tab-deliveries">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h3>Priorização de Entregas</h3>
          <button class="btn btn-primary" onclick="saveOverride()">Salvar Ordem (Override)</button>
        </div>
        <p style="font-size:13px;color:#64748b;margin-bottom:12px">Arraste para reordenar. Clique na prioridade para alterar.</p>
        <div class="delivery-list" id="delivery-sortable"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const API = '';
let state = { drivers: [], deliveries: [], routes: [], incidents: [], stats: null };
let map, markersLayer;

// === Navigation ===
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    document.getElementById('page-title').textContent = btn.textContent;
    if (btn.dataset.tab === 'map') setTimeout(initMap, 100);
  });
});

// === API ===
async function api(path, opts = {}) {
  const res = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  return res.json();
}

async function loadAll() {
  try {
    const [stats, drivers, deliveries, routes, incidents] = await Promise.all([
      api('/api/v1/dashboard/stats'),
      api('/api/v1/drivers'),
      api('/api/v1/deliveries'),
      api('/api/v1/routes'),
      api('/api/v1/incidents'),
    ]);
    state = { stats, drivers, deliveries, routes, incidents };
    renderDashboard();
    renderDrivers();
    renderDeliveries();
    if (map) renderMap();
  } catch (e) { console.error(e); showToast('Erro carregando dados: ' + e.message); }
}

// === Render Dashboard ===
function renderDashboard() {
  const s = state.stats;
  if (!s) return;
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="label">Motoristas Ativos</div><div class="value blue">${s.active_drivers}<span style="font-size:14px;color:#64748b">/${s.total_drivers}</span></div></div>
    <div class="stat-card"><div class="label">Pendentes</div><div class="value orange">${s.pending_deliveries}</div></div>
    <div class="stat-card"><div class="label">Em Progresso</div><div class="value blue">${s.in_progress_deliveries}</div></div>
    <div class="stat-card"><div class="label">Concluídas</div><div class="value green">${s.completed_deliveries}</div></div>
    <div class="stat-card"><div class="label">Incidentes</div><div class="value red">${s.active_incidents}</div></div>
  `;
  const tbody = document.getElementById('deliveries-table');
  tbody.innerHTML = state.deliveries.filter(d => d.status !== 'cancelled').slice(0, 12).map(d => `
    <tr>
      <td><code>${d.order_number}</code></td>
      <td>${d.customer_name}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.address}</td>
      <td><span class="badge ${d.priority}">${d.priority}</span></td>
      <td><span class="badge status">${d.status}</span></td>
      <td>${d.sequence_order || '-'}</td>
    </tr>
  `).join('');
  const incList = document.getElementById('incidents-list');
  incList.innerHTML = state.incidents.map(i => `
    <div class="incident-card">
      <div class="icon">${i.incident_type==='accident'?'🚗':i.incident_type==='jam'?'🚦':i.incident_type==='road_closed'?'🚧':'⚠️'}</div>
      <div class="details">
        <div class="type">${i.incident_type} — Severidade ${i.severity}/5</div>
        <div>${i.street || 'Localização desconhecida'}</div>
        ${i.delay_seconds > 0 ? `<div style="color:#dc2626">+${Math.round(i.delay_seconds/60)} min de atraso</div>` : ''}
      </div>
    </div>
  `).join('');
}

// === Render Drivers ===
function renderDrivers() {
  const grid = document.getElementById('drivers-grid');
  grid.innerHTML = state.drivers.map(d => {
    const route = state.routes.find(r => r.driver_id === d.id);
    return `
    <div class="driver-card">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div><strong>${d.name}</strong><br><span style="font-size:12px;color:#64748b">${d.vehicle_plate} — ${d.vehicle_type}</span></div>
        <span class="driver-status ${d.status}">${d.status}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px">
        <div style="background:#f8fafc;padding:8px;border-radius:6px"><div style="color:#64748b">Localização</div><strong>${d.current_lat ? d.current_lat.toFixed(3)+', '+d.current_lng.toFixed(3) : 'N/A'}</strong></div>
        <div style="background:#f8fafc;padding:8px;border-radius:6px"><div style="color:#64748b">Entregas</div><strong>${route ? route.completed_stops+'/'+route.total_stops : '0/0'}</strong></div>
      </div>
      ${route ? `<div style="background:#eff6ff;padding:8px;border-radius:6px;font-size:12px">Rota: ${route.total_distance_km}km | Score: ${route.optimization_score}</div>` : ''}
      <button class="btn btn-primary btn-sm" onclick="optimizeFor('${d.id}')" ${d.status==='offline'||!d.current_lat?'disabled':''}>Otimizar Rota</button>
    </div>`;
  }).join('');
}

// === Render Deliveries (sortable) ===
function renderDeliveries() {
  const list = document.getElementById('delivery-sortable');
  const sorted = [...state.deliveries].filter(d=>d.status!=='cancelled'&&d.status!=='confirmed').sort((a,b)=>b.priority_score-a.priority_score);
  list.innerHTML = sorted.map((d, i) => `
    <div class="delivery-item" draggable="true" data-id="${d.id}">
      <div class="seq">${i+1}</div>
      <div class="info"><div class="name">${d.order_number} — ${d.customer_name}</div><div class="addr">${d.address}</div></div>
      <select onchange="changePriority('${d.id}', this.value)" style="flex-shrink:0">
        <option value="critical" ${d.priority==='critical'?'selected':''}>Crítica</option>
        <option value="high" ${d.priority==='high'?'selected':''}>Alta</option>
        <option value="normal" ${d.priority==='normal'?'selected':''}>Normal</option>
        <option value="low" ${d.priority==='low'?'selected':''}>Baixa</option>
      </select>
      <span class="badge ${d.priority}">${d.priority}</span>
      <span class="badge status">${d.status}</span>
    </div>
  `).join('');
  // Drag & drop
  let dragEl = null;
  list.querySelectorAll('.delivery-item').forEach(el => {
    el.addEventListener('dragstart', () => { dragEl = el; el.style.opacity = '0.4'; });
    el.addEventListener('dragend', () => { el.style.opacity = '1'; dragEl = null; });
    el.addEventListener('dragover', e => e.preventDefault());
    el.addEventListener('drop', e => {
      e.preventDefault();
      if (dragEl && dragEl !== el) list.insertBefore(dragEl, el);
    });
  });
}

// === Map ===
function initMap() {
  if (map) { map.invalidateSize(); renderMap(); return; }
  map = L.map('map').setView([-23.555, -46.66], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
  renderMap();
}
function renderMap() {
  if (!map) return;
  markersLayer.clearLayers();
  // Drivers
  state.drivers.filter(d=>d.current_lat).forEach(d => {
    const color = d.status==='en_route'?'blue':d.status==='delivering'?'green':'gray';
    L.circleMarker([d.current_lat, d.current_lng], {radius:10, color, fillColor:color, fillOpacity:0.8})
      .bindPopup(`<b>${d.name}</b><br>${d.vehicle_plate}<br>Status: ${d.status}`)
      .addTo(markersLayer);
  });
  // Deliveries
  state.deliveries.filter(d=>d.status!=='cancelled').forEach(d => {
    const color = d.status==='confirmed'?'green':d.priority==='critical'?'red':d.priority==='high'?'orange':'#2563eb';
    L.circleMarker([d.lat, d.lng], {radius:6, color, fillColor:color, fillOpacity:0.7})
      .bindPopup(`<b>${d.order_number}</b><br>${d.customer_name}<br>${d.address}<br>Prioridade: ${d.priority}<br>Status: ${d.status}`)
      .addTo(markersLayer);
  });
  // Incidents
  state.incidents.forEach(i => {
    L.circle([i.lat, i.lng], {radius:300+i.severity*100, color:'red', fillColor:'red', fillOpacity:0.12, weight:1})
      .bindPopup(`<b style="color:red">${i.incident_type}</b><br>Severidade: ${i.severity}/5<br>${i.street||''}<br>+${Math.round(i.delay_seconds/60)}min`)
      .addTo(markersLayer);
  });
  // Route lines
  state.routes.filter(r=>r.status==='active').forEach(route => {
    const stops = route.stops.sort((a,b)=>a.sequence_order-b.sequence_order);
    const points = [[route.origin_lat, route.origin_lng]];
    stops.forEach(s => {
      const del = state.deliveries.find(d=>d.id===s.delivery_id);
      if (del) points.push([del.lat, del.lng]);
    });
    if (points.length > 1) L.polyline(points, {color:'#2563eb', weight:3, opacity:0.7, dashArray:'6 8'}).addTo(markersLayer);
  });
}

// === Actions ===
async function optimizeFor(driverId) {
  showToast('Otimizando rota...');
  try {
    const r = await api('/api/v1/routes/optimize', { method:'POST', body: JSON.stringify({driver_id:driverId}) });
    showToast(`Rota otimizada! ${r.total_distance_km}km, Score: ${r.optimization_score}`);
    loadAll();
  } catch(e) { showToast('Erro: '+e.message); }
}
async function changePriority(id, priority) {
  const scores = {critical:100, high:75, normal:50, low:25};
  await api('/api/v1/deliveries/'+id, { method:'PATCH', body:JSON.stringify({priority, priority_score:scores[priority]}) });
  showToast(`Prioridade atualizada: ${priority}`);
  loadAll();
}
async function saveOverride() {
  if (!state.routes.length) { showToast('Nenhuma rota ativa'); return; }
  const items = document.querySelectorAll('#delivery-sortable .delivery-item');
  const ids = Array.from(items).map(el=>el.dataset.id);
  const routeId = state.routes[0].id;
  await api('/api/v1/routes/'+routeId+'/override-priority', {
    method:'POST', body:JSON.stringify({delivery_ids_ordered:ids, reason:'Reordenação manual pelo gestor'})
  });
  showToast('Ordem salva! Rota do motorista atualizada.');
  loadAll();
}
async function confirmDelivery(id, name) {
  const d = state.deliveries.find(x=>x.id===id);
  if (!d) return;
  await api('/api/v1/deliveries/'+id+'/confirm', {
    method:'POST', body:JSON.stringify({receiver_name:name+' (confirmado)', notes:'Via dashboard', lat:d.lat, lng:d.lng})
  });
  showToast('Entrega confirmada! Rota re-otimizada.');
  loadAll();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(()=>{ t.style.display='none'; }, 3000);
}

// === Auto refresh ===
loadAll();
setInterval(loadAll, 10000);
</script>
</body>
</html>
